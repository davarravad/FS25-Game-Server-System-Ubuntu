map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Viewer authorisation answers are cached briefly so a game panel page load (or a bot poll)
# costs one PHP round trip per instance instead of one per asset. Console (VNC) upgrades carry a
# per-session ticket in their path and are never cached.
fastcgi_cache_path /var/cache/nginx/central-auth levels=1 keys_zone=central_auth:1m max_size=16m inactive=2m;

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 50G;

    location ~ ^/central/view/(?<viewer_instance>[a-zA-Z0-9_-]+)/(?<viewer_kind>vnc|web)(?<viewer_path>/.*)$ {
        set $central_auth_uncached 0;
        if ($viewer_kind = vnc) {
            set $central_auth_uncached 1;
        }
        auth_request /central-auth;
        auth_request_set $viewer_upstream $upstream_http_x_viewer_upstream;
        resolver 127.0.0.11 valid=10s ipv6=off;
        proxy_pass http://$viewer_upstream$viewer_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header X-Farmservers-Upstream-Origin;
        add_header X-Farmservers-Upstream-Origin "http://$upstream_addr" always;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Central-Token "";
        proxy_set_header X-Central-User "";
        proxy_set_header X-Central-Role "";
        proxy_set_header X-Central-Public "";
        proxy_set_header CF-Access-Client-Id "";
        proxy_set_header CF-Access-Client-Secret "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 900s;
        proxy_buffering off;
    }

    location = /central-auth {
        internal;
        include fastcgi_params;
        fastcgi_pass_request_body off;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param QUERY_STRING "route=central_view_auth&instance=$viewer_instance&kind=$viewer_kind";
        fastcgi_pass web:9000;
        fastcgi_cache central_auth;
        fastcgi_cache_key "$viewer_instance|$viewer_kind|$http_x_central_public|$http_x_central_user|$http_x_central_role|$http_x_central_token";
        fastcgi_cache_valid 204 30s;
        fastcgi_cache_valid 403 5s;
        fastcgi_cache_bypass $central_auth_uncached;
        fastcgi_no_cache $central_auth_uncached;
        fastcgi_cache_lock on;
        fastcgi_ignore_headers Cache-Control Expires Set-Cookie;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_pass web:9000;
        fastcgi_read_timeout 150s;
    }

    location ~ /\.ht {
        deny all;
    }
}
